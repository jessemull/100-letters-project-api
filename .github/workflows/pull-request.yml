name: Lint & Test

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Run Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Linting
        run: |
          npm run lint:all:fix

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Run Jest Tests
        run: |
          npm run test:all

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
